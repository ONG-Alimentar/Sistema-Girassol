spring.application.name=girassol

# Config base — vale para TODOS os profiles (dev, prod e testes). Ajustes
# específicos de desenvolvimento ficam em application-dev.properties.

# --- Banco de dados -----------------------------------------------------------
# Lê das vars SPRING_DATASOURCE_* (env no Render em prod; modelo em
# ../../../.env.local para dev), com defaults para um Postgres local. Nos testes,
# o @ServiceConnection do Testcontainers sobrescreve estas três.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/girassol}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# --- JPA / Hibernate ----------------------------------------------------------
# update: o Hibernate gera e evolui o schema do banco a partir das @Entity.
# Abordagem adequada ao protótipo da disciplina (sem migrations à mão).
# Atenção: 'update' só ACRESCENTA — não remove nem renomeia colunas/tabelas.
# Para mudança destrutiva em dev, recrie o banco (drop do container Postgres).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Erros HTTP ---------------------------------------------------------------
# Inclui a 'message' no corpo de erro para o front exibir (ex.: 401 do login).
server.error.include-message=always

# --- Cookie de sessão ---------------------------------------------------------
# Prod é cross-site (Pages ↔ Render): exige SameSite=None; Secure para o cookie
# ser enviado. Dev (same-site, http) sobrescreve em application-dev.properties.
# ATENÇÃO (CSRF): SameSite=None remove a mitigação implícita que o Lax dava
# contra CSRF, e o CSRF está desabilitado no SecurityConfig (csrf.disable()).
# Aceitável no protótipo; reavaliar ambos antes de um uso real com dados reais.
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true

# Profile de desenvolvimento local.
# Ative com: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
# (ou SPRING_PROFILES_ACTIVE=dev). Em produção o Render usa o profile 'prod'.

# --- Banco de dados -----------------------------------------------------------
# Lê das mesmas vars SPRING_DATASOURCE_* do deploy (modelo em ../../../.env.local),
# com defaults para um Postgres local. Para usar Postgres local:
#   docker run --name girassol-db -e POSTGRES_PASSWORD=postgres \
#     -e POSTGRES_DB=girassol -p 5432:5432 -d postgres:18
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/girassol}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# --- JPA / Hibernate ----------------------------------------------------------
# validate: Hibernate NUNCA altera o schema — só confere que as entidades batem
# com o que o Flyway criou. O schema é responsabilidade das migrations.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Logging amigável em dev (SQL formatado no console).
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG

# --- Flyway -------------------------------------------------------------------
# Roda as migrations de src/main/resources/db/migration no startup, antes do JPA.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Dica p/ bootstrap da 1a migration a partir das entidades (rode UMA vez, pegue o
# script gerado em target/schema.sql, limpe e salve como db/migration/V1__init.sql):
#   spring.jpa.properties.jakarta.persistence.schema-generation.scripts.action=create
#   spring.jpa.properties.jakarta.persistence.schema-generation.scripts.create-target=target/schema.sql

# Profile de desenvolvimento local.
# Ative com: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
# (ou SPRING_PROFILES_ACTIVE=dev). Em produção o Render usa o profile 'prod'.
#
# Datasource e JPA (ddl-auto=update) ficam no application.properties base, pois
# valem para todos os ambientes. Aqui só entram conveniências de dev.

# --- Logging ------------------------------------------------------------------
# SQL formatado no console durante o desenvolvimento.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG

# --- Seed RBAC ----------------------------------------------------------------
# Cria um usuário admin inicial (senha padrão) só em desenvolvimento.
# Login dev: admin@ong.org / admin
app.seed.admin=true

# Profile de produção (Render).
#
# Email (recuperação de senha via OTP, SmtpEmailService). Só é carregado com o
# profile 'prod' — definir spring.mail.host em qualquer outro profile ativaria
# a auto-configuração de mail do Spring Boot (JavaMailSender + health check)
# mesmo sem um SMTP real disponível, quebrando o /actuator/health.
#
# Provedor: Brevo (relay SMTP, plano free — ver docs/deploy/README.md).
# SPRING_MAIL_USERNAME/PASSWORD vêm do painel do Brevo (login da conta + chave
# SMTP, não a senha da conta). APP_EMAIL_REMETENTE precisa ser um remetente
# verificado no Brevo, senão o envio falha.
spring.mail.host=${SPRING_MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.email.remetente=${APP_EMAIL_REMETENTE:no-reply@ongalimentar.org}
